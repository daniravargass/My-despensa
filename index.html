<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lista de Supermercado</title>
<style>
html { height: 100%; overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #f4f4f8;
–card: #ffffff;
–border: #eeecf0;
–text: #1a1a2e;
–sub: #9999aa;
–radius: 18px;
–nav-h: 72px;
–accent: #5b5fc7;
}

body { font-family: -apple-system, BlinkMacSystemFont, ‘Segoe UI’, sans-serif; background: var(–bg); color: var(–text); min-height: 100%; overflow-x: hidden; padding-bottom: calc(var(–nav-h) + env(safe-area-inset-bottom, 0px)); }

/* ── Top header ── */
.top-header { background: var(–card); padding: 14px 18px 10px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(–border); }
.top-header-row { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-size: 15px; font-weight: 700; color: var(–text); }
.save-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(–sub); }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; transition: background .3s; }
.save-dot.saved { background: #34c47c; }
.saved-date { font-size: 10px; color: var(–sub); margin-top: 2px; }

/* ── Search bar ── */
.search-bar { display: flex; align-items: center; gap: 10px; background: var(–bg); border-radius: 14px; padding: 8px 14px; margin-top: 10px; }
.search-bar svg { color: var(–sub); flex-shrink: 0; }
.search-bar input { flex: 1; border: none; background: transparent; font-size: 12px; font-family: inherit; outline: none; color: var(–text); }
.search-bar input::placeholder { color: var(–sub); }
.search-bar .s-clear { border: none; background: transparent; color: var(–sub); font-size: 16px; cursor: pointer; padding: 0; display: none; line-height: 1; }
.search-bar .s-clear.visible { display: block; }

/* ── Category tabs ── */
.cat-tabs-wrap { overflow-x: auto; white-space: nowrap; padding: 8px 14px; scrollbar-width: none; }
.cat-tabs-wrap::-webkit-scrollbar { display: none; }
.cat-tab { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(–border); background: var(–card); font-size: 11px; font-family: inherit; color: var(–sub); cursor: pointer; transition: all .15s; margin-right: 5px; font-weight: 500; }
.cat-tab.active { background: var(–text); color: #fff; border-color: var(–text); }
.cat-tab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Main ── */
main { padding: 0 14px 20px; max-width: 680px; margin: 0 auto; }

/* views */
.view { display: none; }
.view.active { display: block; }

/* ── Category cards ── */
.cat-card { background: var(–card); border-radius: var(–radius); margin-bottom: 10px; overflow: hidden; border: 1.5px solid var(–border); transition: box-shadow .15s; }
.cat-card.drag-over-card { box-shadow: 0 0 0 2.5px var(–accent); }
.cat-card.card-dragging { opacity: .4; }

.cat-card-header { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; user-select: none; }
.cat-header-text { flex: 1; min-width: 0; }
.cat-header-name { font-size: 13px; font-weight: 700; color: var(–text); }
.cat-header-name-input { font-size: 13px; font-weight: 700; color: var(–text); background: transparent; border: none; outline: none; font-family: inherit; width: 100%; }
.cat-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; flex-shrink: 0; }
.cat-chevron { color: var(–sub); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
.cat-chevron.open { transform: rotate(180deg); }
.cat-drag-grip { color: #ccc; flex-shrink: 0; cursor: grab; padding: 4px; }
.cat-drag-grip:active { cursor: grabbing; }

/* items */
.cat-items { border-top: 1.5px solid var(–border); }
.item-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(–border); transition: background .1s; }
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: #f9f9fc; }
.item-row.dragging { opacity: .35; }
.item-row.drag-over { background: #eef6ff; border-top: 2px solid var(–accent); }
.item-drag-grip { color: #ddd; flex-shrink: 0; cursor: grab; }
.item-drag-grip:active { cursor: grabbing; }
.item-name-input { flex: 1; border: none; background: transparent; font-size: 12px; font-family: inherit; outline: none; color: var(–text); padding: 0; min-width: 0; }
.item-name-input:focus { background: #f4f4f8; border-radius: 6px; padding: 2px 6px; }
.item-name-input.has-stock { font-weight: 600; }
.qty-ctrl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.qty-btn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(–border); background: var(–card); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(–text); transition: all .12s; font-family: inherit; line-height: 1; }
.qty-btn:hover { background: var(–bg); }
.qty-btn.plus { border-color: var(–accent); color: var(–accent); }
.qty-val { font-size: 12px; font-weight: 700; min-width: 18px; text-align: center; color: var(–sub); }
.qty-val.has { color: #34c47c; }
.pending-badge { font-size: 9px; font-weight: 700; color: #fff; background: #f39c12; border-radius: 99px; padding: 1px 5px; flex-shrink: 0; }
.item-del { width: 18px; height: 18px; border-radius: 50%; border: none; background: transparent; color: #ddd; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s; line-height: 1; }
.item-del:hover { background: #fdf0f0; color: #e74c3c; }

/* add item row */
.add-item-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(–border); }
.add-item-input { flex: 1; border: none; background: transparent; font-size: 12px; font-family: inherit; outline: none; color: var(–sub); }
.add-item-input::placeholder { color: #ccc; }
.add-item-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed #ccc; background: transparent; color: #bbb; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s; line-height: 1; }
.add-item-btn:hover { border-color: #34c47c; color: #34c47c; }

/* add category button */
.add-cat-btn { width: 100%; padding: 11px; background: var(–card); border: 1.5px dashed var(–border); border-radius: var(–radius); font-size: 12px; color: var(–sub); cursor: pointer; font-family: inherit; transition: all .15s; margin-bottom: 10px; }
.add-cat-btn:hover { border-color: var(–accent); color: var(–accent); }

/* ── Search results ── */
.search-section-title { font-size: 10px; font-weight: 700; color: var(–sub); text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; }
.search-result-card { background: var(–card); border-radius: var(–radius); overflow: hidden; border: 1.5px solid var(–border); margin-bottom: 10px; }
.search-result-row { display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-bottom: 1px solid var(–border); }
.search-result-row:last-child { border-bottom: none; }
.search-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.search-name { flex: 1; font-size: 14px; color: var(–text); }
.search-name mark { background: #fff3b0; border-radius: 3px; font-style: normal; }
.search-cat-lbl { font-size: 11px; color: var(–sub); }
.search-empty { text-align: center; padding: 2rem; font-size: 14px; color: var(–sub); }

/* ── General view (summary) ── */
.general-card { background: var(–card); border-radius: var(–radius); padding: 20px; border: 1.5px solid var(–border); margin-bottom: 10px; }
.general-total { font-size: 40px; font-weight: 800; color: #34c47c; line-height: 1; }
.general-sub { font-size: 13px; color: var(–sub); margin-top: 4px; }
.general-donut-wrap { display: flex; align-items: center; gap: 20px; margin-top: 16px; }
.general-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.general-legend-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.general-legend-row:hover .general-legend-name { color: var(–accent); }
.general-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.general-legend-name { font-size: 13px; color: var(–text); flex: 1; }
.general-legend-ratio { font-size: 13px; font-weight: 700; }

/* ── Shop view ── */
.shop-add-bar { background: var(–card); border-radius: var(–radius); padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid var(–border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.shop-autocomplete-wrap { position: relative; flex: 1; min-width: 160px; }
.shop-autocomplete-wrap input { width: 100%; border: 1.5px solid var(–border); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; background: var(–bg); }
.shop-autocomplete-wrap input:focus { border-color: var(–accent); background: #fff; }
.shop-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1.5px solid var(–border); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.10); z-index: 60; max-height: 240px; overflow-y: auto; }
.shop-dropdown.open { display: block; }
.shop-dd-item { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
.shop-dd-item:hover, .shop-dd-item.focused { background: #f0f0ff; }
.dd-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dd-name { flex: 1; }
.dd-name mark { background: #fff3b0; border-radius: 3px; font-style: normal; }
.dd-cat { font-size: 11px; color: var(–sub); }
.shop-dd-create { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; color: var(–accent); font-weight: 600; border-top: 1px solid var(–border); }
.shop-dd-create:hover, .shop-dd-create.focused { background: #f0f0ff; }
.shop-qty-wrap { display: flex; align-items: center; gap: 6px; }
.shop-qty-wrap label { font-size: 12px; color: var(–sub); }
.shop-qty-input { width: 56px; border: 1.5px solid var(–border); border-radius: 10px; padding: 8px 8px; font-size: 14px; font-family: inherit; text-align: center; outline: none; background: var(–bg); }
.shop-qty-input:focus { border-color: var(–accent); }
.shop-cat-select { border: 1.5px solid var(–border); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; background: var(–bg); cursor: pointer; }
.shop-cat-select:focus { border-color: var(–accent); }
.btn-add { background: var(–accent); color: #fff; border: none; border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; }
.btn-add:hover { background: #4a4eab; }

.shop-total-bar { background: #eef9f4; border: 1.5px solid #34c47c; border-radius: var(–radius); padding: 12px 16px; margin-bottom: 10px; display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shop-total-bar.visible { display: flex; }
.shop-total-label { font-size: 13px; font-weight: 700; color: #34c47c; }
.shop-total-input-wrap { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.shop-total-currency { font-size: 14px; color: var(–sub); }
.shop-total-input { border: 1.5px solid #cce8d8; border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight: 700; font-family: inherit; outline: none; width: 140px; background: #fff; }
.shop-total-input:focus { border-color: #34c47c; }

.shop-list-card { background: var(–card); border-radius: var(–radius); overflow: hidden; border: 1.5px solid var(–border); margin-bottom: 10px; }
.shop-list-empty { text-align: center; padding: 2.5rem 1rem; font-size: 14px; color: var(–sub); }
.shop-item-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(–border); transition: background .1s; }
.shop-item-row:last-child { border-bottom: none; }
.shop-item-row:hover { background: #f9f9fc; }
.shop-item-row.bought { background: #f5fef9; }
.shop-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(–border); background: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.shop-check:hover { border-color: #34c47c; }
.shop-check.checked { background: #34c47c; border-color: #34c47c; }
.shop-item-name { font-size: 14px; color: var(–text); flex: 1; }
.shop-item-row.bought .shop-item-name { text-decoration: line-through; color: var(–sub); }
.shop-item-cat { font-size: 11px; color: var(–sub); }
.shop-item-qty { font-size: 13px; font-weight: 700; color: var(–sub); }
.shop-item-row.bought .shop-item-qty { color: #34c47c; }
.shop-del { width: 22px; height: 22px; border-radius: 50%; border: none; background: transparent; color: #ddd; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1; }
.shop-del:hover { background: #fdf0f0; color: #e74c3c; }
.shop-sep { padding: 7px 16px; font-size: 11px; color: var(–sub); background: #f9f9fc; border-bottom: 1px solid var(–border); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

.shop-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
.shop-progress-label { font-size: 12px; color: var(–sub); }
.shop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { font-size: 12px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(–border); background: var(–card); color: var(–text); cursor: pointer; font-family: inherit; transition: all .15s; }
.btn-sm:hover { background: var(–bg); }
.btn-sm.danger { border-color: #f0c4c4; color: #c0392b; }
.btn-sm.danger:hover { background: #fdf0f0; }
.btn-sm.purple { border-color: var(–accent); color: var(–accent); }

/* ── Stock top ── */
.stock-section { margin-bottom: 12px; }
.stock-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
.stock-title { font-size: 11px; font-weight: 700; color: var(–sub); text-transform: uppercase; letter-spacing: .5px; }
.stock-controls { display: flex; gap: 5px; align-items: center; }
.stock-sort-btn { font-size: 11px; padding: 3px 10px; border-radius: 99px; border: 1.5px solid var(–border); background: var(–card); color: var(–sub); cursor: pointer; font-family: inherit; transition: all .15s; }
.stock-sort-btn.active { background: var(–text); color: #fff; border-color: var(–text); }
.stock-collapse-btn { background: none; border: none; color: var(–sub); cursor: pointer; font-size: 12px; padding: 2px 6px; transition: transform .2s; }
.stock-collapse-btn.open { transform: rotate(180deg); }

.stock-filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.stock-filter-lbl { font-size: 11px; color: var(–sub); }
.stock-filter-chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1.5px solid var(–border); background: var(–card); color: var(–sub); cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: all .15s; }
.stock-filter-chip.on { color: #fff; border-color: transparent; }
.fchip-dot { width: 7px; height: 7px; border-radius: 50%; }

.stock-cat-order { background: var(–card); border: 1.5px solid var(–border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: none; }
.stock-cat-order.open { display: block; }
.stock-cat-order-title { font-size: 11px; color: var(–sub); margin-bottom: 8px; }
.stock-cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stock-cat-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(–border); background: var(–card); cursor: grab; user-select: none; }
.stock-cat-chip:active { cursor: grabbing; }
.stock-cat-chip.chip-dragging { opacity: .4; }
.stock-cat-chip.chip-over { box-shadow: 0 0 0 2px #34c47c; }
.chip-dot { width: 7px; height: 7px; border-radius: 50%; }

.stock-list { background: var(–card); border: 1.5px solid var(–border); border-radius: var(–radius); overflow: hidden; }
.stock-list-wrap.collapsed { display: none; }
.stock-group-hdr { padding: 7px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(–border); }
.stock-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(–border); }
.stock-row:last-child { border-bottom: none; }
.stock-row:hover { background: #f9f9fc; }
.stock-cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.stock-item-name { font-size: 12px; font-weight: 500; color: var(–text); flex: 1; }
.stock-cat-lbl { font-size: 10px; color: var(–sub); }
.stock-qty { font-size: 13px; font-weight: 800; color: #34c47c; min-width: 24px; text-align: right; }

/* ── Meals ── */
.meals-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.meals-week-label { flex: 1; text-align: center; font-size: 15px; font-weight: 700; }
.nav-circle-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(–border); background: var(–card); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(–text); font-family: inherit; }
.nav-circle-btn:hover { background: var(–bg); }
.today-btn { font-size: 12px; padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(–border); background: var(–card); color: var(–text); cursor: pointer; font-family: inherit; }

.meals-day-card { background: var(–card); border-radius: var(–radius); border: 1.5px solid var(–border); margin-bottom: 10px; overflow: hidden; }
.meals-day-card.today { border-color: #34c47c; }
.meals-day-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(–border); }
.meals-day-name { font-size: 15px; font-weight: 700; }
.meals-day-card.today .meals-day-name { color: #34c47c; }
.meals-day-date { font-size: 12px; color: var(–sub); }
.meals-slots { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.meals-slot { display: flex; align-items: flex-start; gap: 10px; }
.meals-slot-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(–sub); min-width: 70px; padding-top: 8px; flex-shrink: 0; }
.meals-slot-ta { flex: 1; border: 1.5px solid var(–border); border-radius: 10px; padding: 7px 10px; font-size: 14px; font-family: inherit; outline: none; resize: none; color: var(–text); background: var(–bg); min-height: 36px; overflow: hidden; line-height: 1.4; }
.meals-slot-ta:focus { border-color: #34c47c; background: #fff; }
.meals-slot-ta::placeholder { color: #ccc; }

/* ── Modals - iOS Safari compatible ── */
.modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 200; }
.modal-bg.open { display: block; }

/* Bottom sheet */
.modal-sheet { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: var(–card); border-radius: 24px 24px 0 0; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 16px); transform: none; }

/* Center sheet (for small modals) */
.modal-small .modal-sheet { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 20px; padding: 20px; width: calc(100% - 40px); max-width: 400px; max-height: 80vh; bottom: auto; right: auto; }

.modal-handle { width: 36px; height: 4px; background: var(–border); border-radius: 99px; margin: 12px auto 0; }
.modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 10px; }
.modal-hdr h3 { font-size: 17px; font-weight: 700; }
.modal-close { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(–bg); color: var(–sub); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(–border); }
.modal-small h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.modal-input { width: 100%; border: 1.5px solid var(–border); border-radius: 12px; padding: 10px 14px; font-size: 15px; font-family: inherit; outline: none; margin-bottom: 12px; }
.modal-input:focus { border-color: var(–accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-modal { font-size: 14px; padding: 8px 18px; border-radius: 12px; border: 1.5px solid var(–border); background: var(–card); color: var(–text); cursor: pointer; font-family: inherit; }
.btn-modal.primary { background: var(–accent); color: #fff; border-color: var(–accent); }
.btn-modal:hover { opacity: .85; }

.budget-nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 8px 20px 14px; }
.budget-month-label { font-size: 16px; font-weight: 700; min-width: 170px; text-align: center; }
.budget-annual { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 20px 16px; }
.budget-ann-card { background: var(–bg); border-radius: 14px; padding: 12px 14px; }
.budget-ann-lbl { font-size: 11px; color: var(–sub); margin-bottom: 4px; }
.budget-ann-val { font-size: 18px; font-weight: 800; }
.budget-ann-val.pos { color: #34c47c; }
.budget-ann-val.neg { color: #e74c3c; }
.budget-month-card { margin: 0 20px 16px; border: 1.5px solid var(–border); border-radius: 18px; padding: 18px; background: var(–card); }

// ── Persistence ───────────────────────────────────────
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var p=JSON.parse(raw);
      cats=p.cats||JSON.parse(JSON.stringify(DEFAULT_CATS));
      // ensure icons
      cats.forEach(function(c){ if(!c.icon) c.icon=CAT_ICONS[c.name]||"📦"; });

      if(p.savedAt) updateLabel(new Date(p.savedAt));
      return;
    }
  }catch(e){}

  cats.forEach(function(c){collapsedCards[c.name]=true;});

    var dot=document.getElementById("save-dot"), txt=document.getElementById("save-text");

    setTimeout(function(){dot.classList.add("saved");txt.textContent="guardado";updateLabel(new Date());},300);

function htmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── Inventory helpers ─────────────────────────────────
function getQty(c,i){return quantities[c+"||"+i]||0;}
function getPendingQty(c,i){return shopItems.filter(function(x){return !x.bought&&x.name===i&&x.catName===c;}).reduce(function(a,x){return a+x.qty;},0);}
function addToShopList(c,i){
  var ex=shopItems.find(function(x){return !x.bought&&x.name===i&&x.catName===c;});
  if(ex){ex.qty++;}else{shopItems.push({id:Date.now()+Math.random(),name:i,qty:1,catName:c,bought:false});}
  scheduleSave();render();
}
function removeFromStock(c,i){var k=c+"||"+i;quantities[k]=Math.max(0,(quantities[k]||0)-1);scheduleSave();render();}
function deleteItem(c,i){
  if(!confirm('¿Eliminar "'+i+'"?'))return;
  var cat=cats.find(function(x){return x.name===c;});if(!cat)return;
  cat.items=cat.items.filter(function(x){return x!==i;});delete quantities[c+"||"+i];scheduleSave();render();
}
function addItemToCat(c,inputEl){
  var v=inputEl.value.trim();if(!v)return;
  var cat=cats.find(function(x){return x.name===c;});if(!cat)return;
  if(cat.items.indexOf(v)===-1){cat.items.push(v);scheduleSave();render();}
  inputEl.value="";
  setTimeout(function(){document.querySelectorAll(".add-item-input").forEach(function(el){if(el.dataset.cat===c)el.focus();});},30);
}
function renameItem(c,old,nw){
  nw=nw.trim();if(!nw||nw===old)return;
  var cat=cats.find(function(x){return x.name===c;});if(!cat)return;
  var idx=cat.items.indexOf(old);if(idx===-1)return;
  cat.items[idx]=nw;
  var ok=c+"||"+old;if(quantities[ok]!==undefined){quantities[c+"||"+nw]=quantities[ok];delete quantities[ok];}
  scheduleSave();
}
function renameCategory(old,nw){
  nw=nw.trim();if(!nw||nw===old)return;
  if(cats.find(function(c){return c.name===nw;})){alert("Ya existe esa categoría.");return;}
  var cat=cats.find(function(c){return c.name===old;});if(!cat)return;
  var newQ={};Object.keys(quantities).forEach(function(k){
    if(k.indexOf(old+"||")===0)newQ[nw+"||"+k.slice(old.length+2)]=quantities[k];else newQ[k]=quantities[k];
  });quantities=newQ;cat.name=nw;
  if(activeFilter===old)activeFilter=nw;scheduleSave();render();
}

// ── Cat modal ─────────────────────────────────────────
function openAddCat(){document.getElementById("modal-cat-name").value="";document.getElementById("modal-cat-bg").classList.add("open");setTimeout(function(){document.getElementById("modal-cat-name").focus();},80);}
function closeAddCat(){document.getElementById("modal-cat-bg").classList.remove("open");}
function addCategory(){

// ── Drag items ────────────────────────────────────────

function onCardItemDrop(e,c){

// ── View switching ────────────────────────────────────
function setView(v){
  activeView=v;
  document.querySelectorAll(".view").forEach(function(el){el.classList.remove("active");});
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active");});
  if(v==="budget"){openBudget();return;}
  var viewMap={"general":"view-general","stock":"view-stock","shop":"view-shop","meals":"view-meals"};
  var viewEl=document.getElementById(viewMap[v]||"view-general");
  if(viewEl)viewEl.classList.add("active");
  var navEl=document.getElementById("nav-"+v);
  if(navEl)navEl.classList.add("active");
  var sw=document.getElementById("search-bar"),ct=document.getElementById("cat-tabs-wrap");
  var showSearch=(v==="general");
  sw.style.display=showSearch?"":"none";
  ct.style.display=showSearch?"":"none";
  render();
}
function setFilter(name){
  activeFilter=name;
  if(name==="Todas"){cats.forEach(function(c){collapsedCards[c.name]=true;});}
  else{cats.forEach(function(c){collapsedCards[c.name]=(c.name!==name);});}
  render();
}

function renderDonutLegend(container,catData,standalone){

  var size=standalone?130:110,r=standalone?50:42,cx=size/2,cy=size/2,circumference=2*Math.PI*r;
  var svgNS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("width",size);svg.setAttribute("height",size);svg.setAttribute("viewBox","0 0 "+size+" "+size);svg.style.flexShrink="0";
  var bg=document.createElementNS(svgNS,"circle");
  bg.setAttribute("cx",cx);bg.setAttribute("cy",cy);bg.setAttribute("r",r);
  bg.setAttribute("fill","none");bg.setAttribute("stroke","#eee");bg.setAttribute("stroke-width","14");svg.appendChild(bg);
  if(totalQty>0){var off=0;catData.forEach(function(c){if(c.qty===0)return;var dash=(c.qty/totalQty)*circumference;var seg=document.createElementNS(svgNS,"circle");seg.setAttribute("cx",cx);seg.setAttribute("cy",cy);seg.setAttribute("r",r);seg.setAttribute("fill","none");seg.setAttribute("stroke",c.color);seg.setAttribute("stroke-width","14");seg.setAttribute("stroke-dasharray",dash+" "+(circumference-dash));seg.setAttribute("stroke-dashoffset",-off+circumference/4);svg.appendChild(seg);off+=dash;});}
  var ct=document.createElementNS(svgNS,"text");ct.setAttribute("x",cx);ct.setAttribute("y",cy-3);ct.setAttribute("text-anchor","middle");ct.setAttribute("font-size",standalone?"17":"14");ct.setAttribute("font-weight","800");ct.setAttribute("fill","#34c47c");ct.textContent=totalQty;
  var cs=document.createElementNS(svgNS,"text");cs.setAttribute("x",cx);cs.setAttribute("y",cy+11);cs.setAttribute("text-anchor","middle");cs.setAttribute("font-size","8");cs.setAttribute("fill","#aaa");cs.textContent="en stock";
  svg.appendChild(ct);svg.appendChild(cs);container.appendChild(svg);
  var legend=document.createElement("div");legend.className="general-legend";
  catData.forEach(function(c){
    var row=document.createElement("div");row.className="general-legend-row";
    row.addEventListener("click",function(){setFilter(c.name);if(activeView!=="inventory")setView("inventory");});
    var dot=document.createElement("div");dot.className="general-legend-dot";dot.style.background=c.color;

  });container.appendChild(legend);
}

var usageCurrentKey = "";

function openUsageLog(catName, item) {
  usageCurrentKey = catName + "||" + item;
  document.getElementById("usage-item-label").textContent = item + " · " + catName;
  var currentStock = quantities[usageCurrentKey] || 0;
  document.getElementById("usage-stock-label").textContent = "Stock actual: " + currentStock;
  document.getElementById("usage-input").value = "";
  renderUsageLogList();
  document.getElementById("modal-usage-bg").classList.add("open");
  setTimeout(function(){ document.getElementById("usage-input").focus(); }, 80);
}

function closeUsageLog() {
  document.getElementById("modal-usage-bg").classList.remove("open");
}

function parseUsageQty(str) {
  str = str.trim();
  // Handle fractions like 1/2, 3/4
  var fracMatch = str.match(/^(\d+)\/(\d+)/);
  if (fracMatch) return parseInt(fracMatch[1]) / parseInt(fracMatch[2]);
  // Handle decimals and integers at start of string
  var numMatch = str.match(/^(\d+([.,]\d+)?)/);
  if (numMatch) return parseFloat(numMatch[1].replace(",","."));
  return 0;
}

function saveUsageEntry() {
  var val = document.getElementById("usage-input").value.trim();
  if (!val) return;
  if (!usageLog[usageCurrentKey]) usageLog[usageCurrentKey] = [];
  usageLog[usageCurrentKey].unshift({ text: val, date: new Date().toISOString() });

  // Try to subtract from stock
  var qty = parseUsageQty(val);
  if (qty > 0) {
    var current = quantities[usageCurrentKey] || 0;
    quantities[usageCurrentKey] = Math.max(0, Math.round((current - qty) * 100) / 100);
  }

  document.getElementById("usage-input").value = "";
  scheduleSave();
  renderUsageLogList();
  // Show updated stock value
  var parts = usageCurrentKey.split("||");
  if (parts.length === 2) {
    var newQty = quantities[usageCurrentKey] || 0;
    var stockEl = document.getElementById("usage-stock-label");
    if (stockEl) stockEl.textContent = "Stock actual: " + newQty;
  }
}

function renderUsageLogList() {
  var el = document.getElementById("usage-log-list"); el.innerHTML = "";
  var entries = usageLog[usageCurrentKey] || [];
  if (!entries.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--sub);padding:6px 0;">Sin registros aún.</div>';
    return;
  }
  entries.forEach(function(e, idx) {
    var d = new Date(e.date);
    var row = document.createElement("div"); row.className = "usage-log-entry";
    var qty = document.createElement("span"); qty.className = "usage-log-qty"; qty.textContent = e.text;
    var date = document.createElement("span"); date.className = "usage-log-date";
    date.textContent = d.toLocaleDateString("es-CL", {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    var del = document.createElement("button"); del.className = "usage-log-del"; del.textContent = "×";
    (function(i){ del.addEventListener("click", function() {
      usageLog[usageCurrentKey].splice(i, 1);
      scheduleSave(); renderUsageLogList();
    }); })(idx);
    row.appendChild(qty); row.appendChild(date); row.appendChild(del); el.appendChild(row);
  });
}

document.getElementById("modal-usage-bg").addEventListener("click", function(e){ if(e.target===this) closeUsageLog(); });
document.getElementById("usage-input").addEventListener("keydown", function(e){ if(e.key==="Enter") saveUsageEntry(); if(e.key==="Escape") closeUsageLog(); });
document.getElementById("btn-modal-cat-cancel").addEventListener("click",closeAddCat);
document.getElementById("btn-modal-cat-ok").addEventListener("click",addCategory);
document.getElementById("modal-cat-bg").addEventListener("click",function(e){if(e.target===this)closeAddCat();});
document.getElementById("modal-cat-name").addEventListener("keydown",function(e){if(e.key==="Enter")addCategory();if(e.key==="Escape")closeAddCat();});

var searchInput=document.getElementById("search-input"),searchClear=document.getElementById("search-clear");
searchInput.addEventListener("input",function(){searchQuery=this.value;searchClear.classList.toggle("visible",!!searchQuery);render();});
searchInput.addEventListener("keydown",function(e){if(e.key==="Escape"){this.value="";searchQuery="";searchClear.classList.remove("visible");render();}});
searchClear.addEventListener("click",function(){searchInput.value="";searchQuery="";this.classList.remove("visible");searchInput.focus();render();});

document.getElementById("btn-shop-add").addEventListener("click",shopAdd);
document.getElementById("shop-name-input").addEventListener("input",function(){renderDD(this.value);});
document.getElementById("shop-name-input").addEventListener("keydown",function(e){var dd=document.getElementById("shop-dropdown");if(dd.classList.contains("open")){if(e.key==="ArrowDown"){e.preventDefault();moveDDFocus(1);return;}if(e.key==="ArrowUp"){e.preventDefault();moveDDFocus(-1);return;}if(e.key==="Enter"){e.preventDefault();if(!selectDDFocused())shopAdd();return;}if(e.key==="Escape"){closeDD();return;}}else{if(e.key==="Enter")shopAdd();}});
document.getElementById("shop-name-input").addEventListener("blur",function(){setTimeout(closeDD,150);});
document.getElementById("shop-qty-input").addEventListener("keydown",function(e){if(e.key==="Enter")shopAdd();});
document.getElementById("btn-shop-confirm").addEventListener("click",confirmPurchase);
document.getElementById("shop-total-input").addEventListener("keydown",function(e){if(e.key==="Enter")confirmPurchase();});
document.getElementById("btn-shop-history").addEventListener("click",openHistory);
document.getElementById("btn-history-close").addEventListener("click",closeHistory);
document.getElementById("modal-history-bg").addEventListener("click",function(e){if(e.target===this)closeHistory();});
document.getElementById("btn-shop-clear-bought").addEventListener("click",function(){shopItems=shopItems.filter(function(i){return !i.bought;});scheduleSave();renderShopList();});
document.getElementById("btn-shop-clear-all").addEventListener("click",function(){if(!confirm("¿Vaciar lista de compras?"))return;shopItems=[];scheduleSave();renderShopList();});

document.getElementById("btn-open-budget")&&document.getElementById("btn-open-budget").addEventListener("click",openBudget);
document.getElementById("btn-budget-close").addEventListener("click",closeBudget);
document.getElementById("modal-budget-bg").addEventListener("click",function(e){if(e.target===this)closeBudget();});
document.getElementById("btn-mo-prev").addEventListener("click",function(){budgetMonth--;if(budgetMonth<0){budgetMonth=11;budgetYear--;}renderBudget();});
document.getElementById("btn-mo-next").addEventListener("click",function(){budgetMonth++;if(budgetMonth>11){budgetMonth=0;budgetYear++;}renderBudget();});

document.getElementById("btn-stock-add-direct").addEventListener("click",openStockAdd);
document.getElementById("btn-stock-add-cancel").addEventListener("click",closeStockAdd);
document.getElementById("btn-stock-add-ok").addEventListener("click",doStockAdd);
document.getElementById("modal-stock-add-bg").addEventListener("click",function(e){if(e.target===this)closeStockAdd();});
document.getElementById("stock-add-name").addEventListener("input",function(){renderStockAddDD(this.value);});
document.getElementById("stock-add-name").addEventListener("blur",function(){setTimeout(function(){document.getElementById("stock-add-dropdown").classList.remove("open");},150);});
document.getElementById("stock-add-name").addEventListener("keydown",function(e){if(e.key==="Enter")doStockAdd();if(e.key==="Escape")closeStockAdd();});
document.getElementById("stock-add-qty").addEventListener("keydown",function(e){if(e.key==="Enter")doStockAdd();});

// stock search
var stockSearchInput=document.getElementById("stock-search-input");
var stockSearchClear=document.getElementById("stock-search-clear");
stockSearchInput.addEventListener("input",function(){
  stockSearchQuery=this.value;
  stockSearchClear.classList.toggle("visible",!!stockSearchQuery);
  renderStockView();
});
stockSearchInput.addEventListener("keydown",function(e){
  if(e.key==="Escape"){this.value="";stockSearchQuery="";stockSearchClear.classList.remove("visible");renderStockView();}
});
stockSearchClear.addEventListener("click",function(){
  stockSearchInput.value="";stockSearchQuery="";this.classList.remove("visible");stockSearchInput.focus();renderStockView();
});

document.getElementById("btn-week-prev").addEventListener("click",function(){mealsWeekOffset--;renderMeals();});
document.getElementById("btn-week-next").addEventListener("click",function(){mealsWeekOffset++;renderMeals();});
document.getElementById("btn-week-today").addEventListener("click",function(){mealsWeekOffset=0;renderMeals();});

loadState();render();doSave();
